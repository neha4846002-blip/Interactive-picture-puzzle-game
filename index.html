<!DOCTYPE html>
<html>
<head>
<title>Picture Puzzle Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">

<h1>🧩 Picture Puzzle Game</h1>

<label>Player Name</label>
<input type="text" id="playerName" placeholder="Enter your name">

<br><br>

<label>Select Grid Level</label>

<select id="gridSize">
<option value="3">3 × 3</option>
<option value="4" selected>4 × 4</option>
<option value="5">5 × 5</option>
<option value="6">6 × 6</option>
<option value="7">7 × 7</option>
<option value="8">8 × 8</option>
<option value="9">9 × 9</option>
<option value="10">10 × 10</option>
</select>

<br><br>

<input type="file" id="imageUpload" accept="image/*">
<p>Upload your own puzzle image</p>

<br>

<button id="startBtn">Start Game</button>

<h3>🏆 High Score</h3>
<ul id="leaderboard"></ul>

</div>


<div id="gameContainer" style="display:none">

<h1>Picture Puzzle Game</h1>

<div class="controls">
<button onclick="showImage()">Preview Image</button>
<button onclick="restartGame()">Restart</button>
</div>

<div class="status">
<p>Timer: <span id="timer">0</span></p>
<p>Score: <span id="score">0</span></p>
<p>Moves Left: <span id="movesLeft">0</span></p>
</div>

<div class="gameArea">

<div id="puzzleGrid"></div>

<img id="previewImage">

</div>

<h3>Puzzle Pieces</h3>

<div id="piecesBox"></div>

</div>


<div id="popup" class="popup">

<div class="popupContent">

<h2 id="popupTitle"></h2>

<p id="popupMessage"></p>

<button onclick="restartGame()">Play Again</button>

</div>

</div>

<canvas id="confettiCanvas"></canvas>

<script src="script.js"></script>

</body>
</html>
